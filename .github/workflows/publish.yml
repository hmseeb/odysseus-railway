name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pinned tag the template references. Bump on every rebuild:
# main-<upstream short sha>-r<n> (Odysseus has no upstream releases).
env:
  IMAGE_TAG: main-9d0d372-r1

permissions:
  contents: read
  packages: write

jobs:
  odysseus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Gate on the contract test before anything is published. Built for the
      # runner's own arch so the test can actually execute the image.
      - name: Build for test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.odysseus
          load: true
          tags: odysseus-railway:test

      - name: Contract test
        run: ./test/odysseus_test.sh odysseus-railway:test

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Railway runs amd64; arm64 is included so the image stays testable
      # locally on Apple silicon.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.odysseus
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/odysseus-railway:latest
            ghcr.io/${{ github.repository_owner }}/odysseus-railway:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/odysseus-railway:${{ env.IMAGE_TAG }}

  searxng:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build for test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.searxng
          load: true
          tags: odysseus-railway-searxng:test

      - name: Contract test
        run: ./test/searxng_test.sh odysseus-railway-searxng:test

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.searxng
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/odysseus-railway-searxng:latest
            ghcr.io/${{ github.repository_owner }}/odysseus-railway-searxng:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/odysseus-railway-searxng:${{ env.IMAGE_TAG }}

# ponytail: the upstream commit in Dockerfile.odysseus and the SearXNG base tag
# in Dockerfile.searxng are bumped by hand, same as buzz-railway and
# safebucket-railway. Automate with a scheduled bump PR when the cadence gets
# annoying.
